name: Publish Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - VOXELSPACE.html
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package standalone build
        if: steps.existing.outputs.exists == 'false'
        shell: bash
        run: |
          mkdir -p dist
          cp VOXELSPACE.html dist/VOXELSPACE.html
          cd dist
          zip -q VOXELSPACE-standalone.zip VOXELSPACE.html

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" \
            dist/VOXELSPACE-standalone.zip \
            --target "$GITHUB_SHA" \
            --title "VOXELSPACE $TAG" \
            --generate-notes

      - name: Release already exists
        if: steps.existing.outputs.exists == 'true'
        run: echo "Release ${{ steps.version.outputs.tag }} already exists; nothing to publish."
